<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tools Hub - Glass Theme</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.3);
            --glass-border: rgba(255, 255, 255, 0.4);
            --accent-purple: #9d8df1;
            --text-main: #4a4a68;
        }

        body {
            /* Same Gradient as Dashboard */
            background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
            background-attachment: fixed;
            font-family: 'Poppins', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 0;
        }

        /* GLASS CONTAINER */
        .hub-container {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 40px;
            border: 1px solid var(--glass-border);
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
            max-width: 1200px;
            margin: auto;
        }

        /* BACK BUTTON */
        .back-nav {
            background: rgba(255, 255, 255, 0.6);
            padding: 10px 20px;
            border-radius: 15px;
            display: inline-flex;
            align-items: center;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 600;
            margin-bottom: 30px;
            transition: 0.3s;
            border: 1px solid var(--glass-border);
        }
        .back-nav:hover {
            background: white;
            transform: translateX(-5px);
            color: var(--accent-purple);
        }

        h1 {
            font-weight: 700;
            color: #333;
            letter-spacing: -0.5px;
        }

        /* FILTER BUTTONS */
        .filter-btn {
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid var(--glass-border);
            padding: 10px 22px;
            margin: 5px;
            border-radius: 15px;
            font-weight: 500;
            color: var(--text-main);
            transition: 0.3s;
        }
        .filter-btn.active, .filter-btn:hover {
            background: white;
            color: var(--accent-purple);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        /* TOOL CARD */
        .tool-card {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 25px;
            border: 1px solid var(--glass-border);
            transition: all 0.3s ease;
            height: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .tool-card:hover {
            transform: translateY(-10px);
            background: rgba(255, 255, 255, 0.6);
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        /* ICON BOX */
        .icon-box {
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-purple);
            font-size: 1.5rem;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }

        .tool-card h6 {
            font-weight: 600;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        /* ACTION BUTTON */
        .visit-btn {
            background: white;
            color: var(--accent-purple);
            text-decoration: none;
            padding: 8px 0;
            border-radius: 12px;
            width: 100%;
            font-weight: 600;
            display: block;
            margin-top: auto;
            transition: 0.3s;
            border: 1px solid transparent;
        }
        .visit-btn:hover {
            background: var(--accent-purple);
            color: white;
        }

        /* BOOKMARK */
        .bookmark {
            position: absolute;
            top: 15px;
            right: 15px;
            cursor: pointer;
            color: #ccc;
            transition: 0.3s;
        }
        .bookmark.active {
            color: #f1c40f;
        }

        /* Custom Scrollbar for Glass look */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.4); border-radius: 10px; }
    </style>
</head>

<body>

<div class="container">
    <div class="hub-container">

        <a href="{{ url_for('dashboard') }}" class="back-nav">
            <i class="fas fa-arrow-left me-2"></i> Dashboard
        </a>

        <div class="text-center mb-5">
            <h1>AI Tools Hub 🚀</h1>
            <p style="color: #777;">Explore the best AI resources for your academic journey</p>
        </div>

        <div class="text-center mb-5">
            <button class="filter-btn active" onclick="filterCategory('all', this)">All</button>
            <button class="filter-btn" onclick="filterCategory('learning', this)">Learning</button>
            <button class="filter-btn" onclick="filterCategory('research', this)">Research</button>
            <button class="filter-btn" onclick="filterCategory('dev', this)">Dev</button>
            <button class="filter-btn" onclick="filterCategory('media', this)">Media</button>
            <button class="filter-btn" onclick="filterCategory('productivity', this)">Productivity</button>
        </div>

        <div class="row g-4" id="toolGrid"></div>
    </div>
</div>

<script>
const tools = [
    /* LEARNING */
    {name:"Khanmigo", category:"learning", link:"https://khanacademy.org", icon:"fa-graduation-cap"},
    {name:"Duolingo Max", category:"learning", link:"https://duolingo.com", icon:"fa-language"},
    {name:"Socratic", category:"learning", link:"https://socratic.org", icon:"fa-lightbulb"},
    {name:"Photomath", category:"learning", link:"https://photomath.com", icon:"fa-calculator"},

    /* RESEARCH */
    {name:"ChatGPT", category:"research", link:"https://chat.openai.com", icon:"fa-robot"},
    {name:"Gemini", category:"research", link:"https://gemini.google.com", icon:"fa-brain"},
    {name:"Claude", category:"research", link:"https://claude.ai", icon:"fa-comment"},
    {name:"Perplexity", category:"research", link:"https://perplexity.ai", icon:"fa-search"},

    /* DEV */
    {name:"GitHub Copilot", category:"dev", link:"https://github.com", icon:"fa-github"},
    {name:"Cursor", category:"dev", link:"https://cursor.sh", icon:"fa-terminal"},
    {name:"Blackbox AI", category:"dev", link:"https://blackbox.ai", icon:"fa-code"},

    /* MEDIA */
    {name:"Midjourney", category:"media", link:"https://midjourney.com", icon:"fa-image"},
    {name:"Leonardo AI", category:"media", link:"https://leonardo.ai", icon:"fa-paint-brush"},
    {name:"Runway", category:"media", link:"https://runwayml.com", icon:"fa-video"},

    /* PRODUCTIVITY */
    {name:"Notion AI", category:"productivity", link:"https://notion.so", icon:"fa-note-sticky"},
    {name:"Grammarly", category:"productivity", link:"https://grammarly.com", icon:"fa-check"},
    {name:"Quillbot", category:"productivity", link:"https://quillbot.com", icon:"fa-pen"},
    {name:"Gamma", category:"productivity", link:"https://gamma.app", icon:"fa-layer-group"}
];

let bookmarks = JSON.parse(localStorage.getItem("bookmarks")) || [];

function renderTools(category="all") {
    const grid = document.getElementById("toolGrid");
    grid.innerHTML = "";

    const filtered = category === "all" ? tools : tools.filter(t => t.category === category);

    filtered.forEach(tool => {
        const isBookmarked = bookmarks.includes(tool.name);
        grid.innerHTML += `
        <div class="col-6 col-md-4 col-lg-3">
            <div class="tool-card">
                <i class="fas fa-bookmark bookmark ${isBookmarked ? 'active' : ''}" onclick="toggleBookmark('${tool.name}', this)"></i>
                <div class="icon-box">
                    <i class="fas ${tool.icon}"></i>
                </div>
                <h6>${tool.name}</h6>
                <a href="${tool.link}" target="_blank" class="visit-btn">Open Tool</a>
            </div>
        </div>
        `;
    });
}

function toggleBookmark(name, el) {
    if (bookmarks.includes(name)) {
        bookmarks = bookmarks.filter(b => b !== name);
        el.classList.remove("active");
    } else {
        bookmarks.push(name);
        el.classList.add("active");
    }
    localStorage.setItem("bookmarks", JSON.stringify(bookmarks));
}

function filterCategory(cat, btn) {
    renderTools(cat);
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
}

renderTools();
</script>

</body>
</html>
